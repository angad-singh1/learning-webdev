<!DOCTYPE html>
<html>
    <head>
        <title>
          yt clone by Angad  
        </title>
        <style>
            p{font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;}
            .thumbnail{
                width:   300px;
                display: block;
            }
            .videopreview{
                width: 300px;
                display: inline-block;
                vertical-align: top;
                margin-right: 15px;
            }
            .searchbar{
                display: block;
                

            }
            .channelpfp{
                display:inline-block;
                width:50px;
                vertical-align: top;
            }
            .video-title{
                margin-top: 0px;
                font-size: 14px;
                font-weight: 500;
                line-height: 20px;
            }
            .videoinfo{
                  display:inline-block;
                  width:200px;
            }
            .pfp{
                width: 40px ;
                border-radius: 50px;
            }
            .thumbnail-row{
                margin-bottom :10px;

            }
            .video-creator,
            .video-stats{
                color :  rgb(96,96,96);
                font-size: 12px;                
            }
            .video-creator{
                margin-bottom: 0px;
            }
            .video-stats{
                margin-top: 3px;
            }
    
        </style>
    </head>
    <body>
        <input class="searchbar" type="textbox" placeholder="Search ">
        <div class="videopreview">
            <div class="thumbnail-row"> 
                <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
            </div>
            <div>    
                <div class="channelpfp">
                    <img class="pfp"  src="channel-pfps/channel-1.jpeg">
                </div>
                <div class="videoinfo">
                    <p class="video-title">Talking tech and AI with Google CEO sundar pichai! </p>
                    <p class="video-creator">Marques Brownlee</p>
                    <p class="video-stats">3.4M views &#183; 6 months ago</p>
                </div> 
            </div>
      
        </div>
        
        
        <div class="videopreview">
            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-2.webp">
            </div>
            <div>
                <div class="channelpfp">
                    <img class="pfp" src="channel-pfps/channel-2.jpeg">  
                </div>  
                <div class="videoinfo">
                    <p class="video-title">Try not to laugh Challenge #9 </p>
                    <p class="video-creator">Markiplier</p>
                    <p class="video-stats">19M views &#183; 4 years ago</p>
                </div>
            </div>
        </div>
    </body>
</html>
