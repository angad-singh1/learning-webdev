<!DOCTYPE html>
<html>
     <head>
        <title>
            uber request a ride 
        </title>
        <style>
            .bigwords{
                font-size: 26px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-weight: 500;
                margin:0px;
                margin-bottom: 16px;
                }
            .pickup,
            .dropoff{
                display: block;
                width: 250px;
                height: 30px;
                background-color: rgb(238, 238, 238);
                border: none;
                margin-bottom: 5px;
            }
            .request {
                background-color : black;
                color : white;
                width : 88px;
                height: 30px;
                font-weight : 540;
                border-style: solid;
                cursor: pointer;
                font-size: 10px
            }
            .request:hover{
                opacity:0.8;
            }
            .request:active{
                opacity:0.6;
            }
            .later{
                height: 30px;
                width: 95px;
                font-size: 10px;
                border: none;
                margin-left: 10px;
                cursor: pointer;
            }
            .later:hover{
                opacity:0.8;
            }
            .later:active{
                opacity:0.6;
            }
            .request,
            .later{
                margin-top: 19px;
            }
    
            
            
        </style>
     </head>
     <body>
        <p class="bigwords">Request a ride now</p>
        <input class="pickup" type="textbox" placeholder="Enter pickup location">
        <input class="dropoff" type="textbox" placeholder="Enter destination">
        <button class="request">
            Request now
        </button>
        <button class="later">
            Schedule for later
        </button>
     </body>
</html>
